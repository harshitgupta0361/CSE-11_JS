<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="converter">
        <h1>Temperature Converter</h1>
        <label for="celsius"><b>Celsius:</b></label>
        <input type="number" id="celsius" placeholder="Enter Celsius">
        <button onclick="ConvertToFahrenheit()">Convert to Fahrenheit</button>
        <p id="result"></p>
        <label for="fahrenheit"><b>Fahrenheit:</b></label>
        <input type="number" id="fahrenheit" placeholder="Enter Fahrenheit">
        <button onclick="ConvertToCelsius()">Convert to Celsius</button>
        <p id="result2"></p>
    </div>
    <script src="java.js"></script>
</body>
</html>
